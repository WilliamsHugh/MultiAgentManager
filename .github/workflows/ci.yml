name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

jobs:
  test-backend-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core tests
        run: |
          python3 tests/test_orchestrator.py
          python3 tests/test_integration.py

  test-backend-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd backend/server && npm ci
      - name: Run server tests
        run: cd backend/server && npm test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build frontend
        run: cd frontend && npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Python
        run: |
          pip install flake8
          flake8 backend/core/ tests/ --max-line-length=100
      - name: Lint Shell
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  integration:
    needs: [test-backend-core, test-backend-server, test-frontend, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python + Node.js
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install all deps
        run: |
          cd backend/server && npm ci
          cd ../../frontend && npm ci
      - name: Start server & test
        run: |
          cd backend/server && node server.js &
          SERVER_PID=$!
          sleep 2
          curl -f http://localhost:3001/api/health || echo "Health check failed"
          kill $SERVER_PID 2>/dev/null || true
